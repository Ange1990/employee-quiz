<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Employee Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:90px 18px 35px;background:linear-gradient(125deg,#2876f6,#7014d2);font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center;color:#252b3c}
#fixed-header{position:fixed;right:18px;top:14px;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:13px;background:rgba(21,16,79,.65);color:white;font-size:14px;z-index:10}
#logout-btn,.nav-btn,button[type=submit]{border:0;border-radius:12px;padding:13px 21px;font:600 15px 'Poppins',sans-serif;cursor:pointer;transition:filter .2s,transform .2s}
#logout-btn,.nav-btn.next,button[type=submit]{background:linear-gradient(120deg,#ff415e,#ff3836);color:white;box-shadow:0 4px 12px #ed394331}
#logout-btn{padding:9px 14px}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb1b8;outline-offset:2px}
.quiz-container{width:min(100%,820px);border-radius:27px;overflow:hidden;background:#fff;box-shadow:0 18px 40px #14164e55}
.quiz-header{background:linear-gradient(110deg,#ff5357,#e71f58);padding:34px 40px 38px;color:white}
h2{margin:0 0 22px;text-align:center;font-size:32px;font-weight:600}
.progress-bar{height:15px;border-radius:30px;background:#ffffff55;overflow:hidden}
.progress{height:100%;width:0;background:#ff3036;border-radius:30px;transition:width .25s}
#quiz-form{padding:28px 38px 36px}
.question-card{color:#343a49}
.section-title{text-align:center;background:#ffe1e5;color:#8b1119;font-weight:700;font-size:29px;padding:15px;border-radius:15px;margin-bottom:25px}
.question-text{font-size:23px;font-weight:700;margin-bottom:17px}
.choice-option{display:flex;align-items:center;gap:15px;margin:13px 0;padding:19px 20px;border:1.5px solid #d4d8e0;border-radius:14px;cursor:pointer;font-weight:600;transition:background .2s,border-color .2s}
.choice-option:has(input:checked){background:#fff0f1;border-color:#ff4657}
.choice-option input{accent-color:#ff4054;width:20px;height:20px;margin:0}
.comment-label{display:block;font-weight:600;margin-top:20px}
textarea{display:block;width:100%;margin-top:10px;min-height:112px;padding:14px;border:1px solid #d6d8df;border-radius:14px;font:inherit;resize:vertical}
.quiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
.nav-btn.prev{background:#f7f7f9;border:1px solid #d7d9df;color:#353b4b}
.nav-btn.next{margin-left:auto}
button[type=submit]{display:block;margin:20px 0 0 auto}
@media(max-width:600px){body{padding:92px 12px 20px;align-items:flex-start}#fixed-header{left:12px;right:12px;justify-content:space-between;font-size:11px}.quiz-header{padding:25px 20px}h2{font-size:25px}#quiz-form{padding:22px 18px}.section-title{font-size:24px}.question-text{font-size:20px}.nav-btn{padding:12px 13px;font-size:13px}}
</style>
</head>
<body>

<div id="fixed-header">
  <span id="user-email">user@email.com</span>
  <button id="logout-btn">Αποσύνδεση</button>
</div>

<div class="quiz-container">
  <div class="quiz-header"><h2>Ερωτηματολόγιο</h2><div class="progress-bar"><div class="progress" id="progress"></div></div></div>

  <form id="quiz-form">
    <div id="questions-container"></div>
    <button type="submit">Υποβολή Απαντήσεων</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admins.js"></script>
<script src="js/assessment-questions.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>
